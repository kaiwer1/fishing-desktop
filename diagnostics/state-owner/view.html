<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared state diagnostic</title>
<style>body{font:20px system-ui;background:#183035;color:#eff5e7;padding:24px}button{padding:12px;font:inherit}pre{white-space:pre-wrap;font-size:16px}small{color:#b5cebf}</style>
<h1 id="role">共享状态验证</h1>
<small>独立诊断计数器；不运行游戏，不读取原存档。</small>
<p><button id="add" disabled>提交一次 +1</button></p><pre id="state">等待宿主</pre>
<script type="module">
import { LeaseSession } from './lease-session.mjs';
const documentId=crypto.randomUUID();
const session=new LeaseSession(documentId);
let snapshot=null,lastReply=null,lastRevoke=null,received=0;
const id=document.querySelector('#state');
function render(){
  id.textContent=JSON.stringify({snapshot,可操作:Boolean(session.state().lease),lastReply},null,2);
  document.querySelector('#add').disabled=!session.state().lease || !snapshot || snapshot.Faulted;
}
window.ownerProbe={
  documentId,
  state:()=>({documentId,...session.state(),snapshot,lastReply,lastRevoke,received}),
  send:command=>window.chrome.webview.postMessage({...command,documentId}),
  cancel:()=>revoke('diagnostic-cancel'),
};
window.chrome.webview.addEventListener('message',e=>{
  const m=e.data;
  if(!m || m.documentId!==documentId)return;
  if(m.kind==='snapshot' || m.kind==='reply'){
    if(snapshot && snapshot.OwnerId===m.snapshot.OwnerId && m.snapshot.Sequence<snapshot.Sequence)return;
    snapshot=m.snapshot;
    if(m.kind==='reply')lastReply={requestId:m.requestId,transportId:m.transportId,...m.reply};
  }
  if(m.kind==='lease'){
    const before=session.state().revision,accepted=session.apply(m);
    if(!accepted && m.lease && session.state().revision===m.revision && m.revision>before){
      window.ownerProbe.send({kind:'revoke',lease:m.lease,cancellationEpoch:session.state().epoch,transportId:crypto.randomUUID(),reason:'late-grant'});
    }
  }
  if(m.kind==='revoke-reply')lastRevoke=m;
  if(m.kind==='role')document.querySelector('#role').textContent=m.role;
  received++;render();
});
function revoke(reason){
  const canceled=session.cancel();render();
  window.ownerProbe.send({kind:'revoke',reason,...canceled,transportId:crypto.randomUUID()});
}
document.querySelector('#add').addEventListener('click',()=>{
  const lease=session.state().lease;
  if(!lease || !snapshot)return;
  window.ownerProbe.send({kind:'command',lease,requestId:crypto.randomUUID(),transportId:crypto.randomUUID(),delta:1,expectedSequence:snapshot.Sequence});
});
window.addEventListener('blur',()=>revoke('blur'));
window.addEventListener('pagehide',()=>revoke('pagehide'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)revoke('hidden')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')revoke('escape')});
</script></html>
