<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102a2c" />
    <title>湖畔 · 钓鱼桌面</title>
  </head>
  <body>
    <canvas id="lake" aria-label="松风湖动态三维场景"></canvas>
    <div id="fallback" role="alert" hidden>当前环境无法创建三维画面。请使用开启硬件加速的新版 Edge 或 Chrome。</div>
    <main id="interface">
      <header class="masthead">
        <div class="identity"><span class="mark" aria-hidden="true">≈</span><div><p class="eyebrow">FISHING DESKTOP</p><h1>湖畔</h1></div></div>
        <div class="player-stats"><span>等级 <b id="player-level">1</b></span><span><b id="coins">120</b> 银币</span><span>体力 <b id="energy-value">100</b></span><span>鱼护 <b id="creel-count">0/50</b></span></div>
      </header>
      <section class="location" aria-label="当前钓点">
        <p class="eyebrow">单竿钓鱼 · 试玩 0.2</p>
        <h2 id="map-title">松风湖</h2>
        <p id="map-copy" class="location-copy">松林环抱的平静湖面</p>
        <p id="map-weather" class="conditions">清晨 · 微风 · 湖泊</p>
      </section>
      <section id="game-panel" class="game-panel" aria-label="钓鱼操作">
        <div class="phase-row"><h2 id="phase-title">准备抛竿</h2><span id="equipped-rod">湖畔入门竿</span></div>
        <p id="game-message" class="game-message" role="status"></p>
        <label class="bait-label" for="bait-select">当前鱼饵<select id="bait-select" aria-label="当前鱼饵"></select></label>
        <div id="bite-window" class="bite-window" hidden>浮漂正在下沉 · <b id="bite-countdown">7</b> 秒内提竿</div>
        <div id="fight-meters" hidden>
          <div class="meter-label"><span>鱼线张力</span><strong id="tension-number">35</strong></div>
          <div id="tension-meter" class="meter tension-meter" role="progressbar" aria-label="鱼线张力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35"><span id="tension-fill"></span><i class="red-zone"></i></div>
          <div class="meter-label"><span>收鱼进度</span><strong id="catch-number">0%</strong></div>
          <div id="catch-meter" class="meter" role="progressbar" aria-label="收鱼进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="catch-fill"></span></div>
          <p id="fight-advice" class="fight-advice"></p>
        </div>
        <div class="fishing-buttons"><button id="fishing-action" class="primary" type="button">抛竿</button><button id="cancel-cast" type="button" hidden>收竿结束</button></div>
        <p class="control-help">点击按钮操作 · 也可在水面选点抛竿</p>
      </section>
      <footer class="dock">
        <div class="actions game-navigation"><button type="button" data-open-hub="maps">钓点地图</button><button type="button" data-open-hub="bag">背包</button><button type="button" data-open-hub="creel">鱼护 / 卖鱼</button><button type="button" data-open-hub="tackle">营地商店</button><button type="button" data-open-hub="book">鱼类图鉴</button><button id="settings-open" type="button">画面设置</button><button id="observe" type="button">静静观赏</button></div>
        <span id="save-status" class="save-status">进度自动保存</span>
      </footer>
    </main>
    <button id="restore" class="restore" type="button" hidden>返回操作</button>
    <dialog id="settings" aria-labelledby="settings-title">
      <form method="dialog">
        <div class="dialog-header"><div><p class="eyebrow">让湖面适合你的屏幕</p><h2 id="settings-title">画面设置</h2></div><button class="icon-button" aria-label="关闭画面设置" value="close">×</button></div>
        <label for="quality">画质<select id="quality"><option value="low">节能</option><option value="medium" selected>均衡</option><option value="high">精细</option></select></label>
        <label for="resolution">渲染比例<select id="resolution"><option value="0.65">65%</option><option value="0.85">85%</option><option value="1" selected>100%</option></select></label>
        <label for="frame-limit">交互帧率<select id="frame-limit"><option value="30" selected>30 帧 / 秒</option><option value="60">60 帧 / 秒</option></select></label>
        <label for="bite-sound">咬钩提示音<input id="bite-sound" type="checkbox" checked /></label>
        <p class="setting-hint">降低画质或渲染比例可以减轻显卡负担。界面文字保持清晰；切到其他标签页时暂停画面。</p>
        <output id="render-info" aria-live="polite"></output>
        <button class="primary done" value="close">完成</button>
      </form>
    </dialog>
    <dialog id="hub" aria-labelledby="hub-title">
      <header class="hub-header"><div><p class="eyebrow">湖畔营地</p><h2 id="hub-title">钓点地图</h2></div><div class="hub-account"><span id="hub-wallet"></span><button id="hub-close" class="icon-button" type="button" aria-label="回到钓点">×</button></div></header>
      <nav id="hub-nav" aria-label="营地分类"><button type="button" data-tab="maps">地图</button><button type="button" data-tab="tackle">渔具商店</button><button type="button" data-tab="food">食品商店</button><button type="button" data-tab="clothes">服装商店</button><button type="button" data-tab="creel">鱼护与鱼市</button><button type="button" data-tab="bag">背包</button><button type="button" data-tab="book">图鉴</button></nav>
      <div id="hub-content"></div><p id="hub-message" role="status"></p>
    </dialog>
    <dialog id="catch-dialog" aria-labelledby="catch-title"><div id="catch-content"></div></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
